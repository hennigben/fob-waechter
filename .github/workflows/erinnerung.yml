name: Erinnerung

# Einmalige Erinnerung an den allgemeinen Vorverkauf (Do 12.11.2026, 12:00 Uhr deutscher Zeit).
# GitHub startet geplante Laeufe oft verspaetet, deshalb schon um 10:30 Uhr deutscher Zeit.
on:
  schedule:
    - cron: "30 9 12 11 *"

jobs:
  erinnern:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Push schicken
        env:
          NTFY_KANAL: ${{ secrets.NTFY_KANAL }}
        run: |
          [ "$(date -u +%Y)" = "2026" ] || exit 0
          curl -s -H "Content-Type: application/json" -d "{\"topic\":\"$NTFY_KANAL\",\"title\":\"Heute 12:00: Vorverkauf Fall Out Boy Berlin\",\"message\":\"Laptop aufklappen, ans Netz und an den Strom, Claude-App offen lassen. Ab 11:45 parallel am Handy in die Warteschlange.\",\"priority\":5,\"tags\":[\"tickets\"]}" https://ntfy.sh/ > /dev/null
